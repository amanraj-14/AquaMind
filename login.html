<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AquaMind Login</title>

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
      }

      body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
        color: white;
        background: radial-gradient(
          circle at center,
          #075240 0%,
          #002c23 42%,
          #001b16 100%
        );
      }

      .login-box {
        width: 100%;
        max-width: 720px;
        padding: 60px;
        border: 2px solid rgba(86, 220, 171, 0.35);
        border-radius: 28px;
        background: rgba(0, 37, 30, 0.72);
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
      }

      .header {
        text-align: center;
        margin-bottom: 48px;
      }

      .logo {
        width: 130px;
        height: 130px;
        margin: 0 auto 28px;
        display: flex;
        justify-content: center;
        align-items: center;
        border: 3px solid #86ee9d;
        border-radius: 50%;
        color: #82ed99;
      }

      .logo svg {
        width: 88px;
        height: 88px;
      }

      h1 {
        font-size: 48px;
        margin-bottom: 18px;
      }

      .header p {
        color: #b8efc2;
        font-size: 22px;
      }

      .form-group {
        margin-bottom: 30px;
      }

      label {
        display: block;
        margin-bottom: 12px;
        color: #d8ffd1;
        font-size: 20px;
        font-weight: bold;
      }

      .input-box {
        position: relative;
      }

      .input-box input {
        width: 100%;
        height: 65px;
        padding: 0 60px 0 66px;
        border: 1px solid rgba(76, 224, 169, 0.35);
        border-radius: 12px;
        outline: none;
        color: white;
        font-size: 18px;
        background: rgba(0, 22, 18, 0.5);
      }

      .input-box input:focus {
        border-color: #35e7a8;
        box-shadow: 0 0 0 3px rgba(53, 231, 168, 0.15);
      }

      .input-box input::placeholder {
        color: #788b88;
      }

      .input-icon {
        position: absolute;
        left: 22px;
        top: 50%;
        transform: translateY(-50%);
        color: #43edb0;
        font-size: 25px;
      }

      .show-password {
        position: absolute;
        right: 16px;
        top: 50%;
        transform: translateY(-50%);
        border: none;
        background: transparent;
        color: #c4d1cf;
        font-size: 22px;
        cursor: pointer;
      }

      .login-btn {
        width: 100%;
        height: 70px;
        border: none;
        border-radius: 12px;
        color: white;
        font-size: 22px;
        font-weight: bold;
        cursor: pointer;
        background: linear-gradient(135deg, #42e5ac, #1dae78);
        transition: 0.2s;
      }

      .login-btn:hover {
        transform: translateY(-2px);
        filter: brightness(1.08);
      }

      .divider {
        display: flex;
        align-items: center;
        gap: 20px;
        margin: 45px 0;
        color: #84938f;
        font-size: 17px;
      }

      .divider::before,
      .divider::after {
        content: "";
        height: 1px;
        flex: 1;
        background: rgba(183, 255, 221, 0.22);
      }

      .signup {
        text-align: center;
        font-size: 18px;
      }

      .signup a {
        color: #35e9ad;
        font-weight: bold;
      }

      #message {
        min-height: 22px;
        margin-top: 14px;
        text-align: center;
        color: #a8ffd2;
      }

      @media (max-width: 600px) {
        .login-box {
          padding: 40px 24px;
        }

        h1 {
          font-size: 36px;
        }

        .header p {
          font-size: 18px;
        }
      }
    </style>
  </head>

  <body>
    <div class="login-box">
      <div class="header">
        <div class="logo">
          <svg
            viewBox="0 0 100 100"
            fill="none"
            stroke="currentColor"
            stroke-width="4"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              fill="currentColor"
              stroke="none"
              d="M51 11C45 27 30 37 30 55c0 13 9 23 20 23s20-10 20-23c0-18-13-29-19-44Z"
            />

            <path d="M57 58c0 7-4 11-9 13" stroke="#003a2d" />
            <path d="M48 78C38 65 24 65 15 64c6 17 19 26 33 25" />
            <path d="M52 78c10-13 24-13 33-14-6 17-19 26-33 25" />
            <path d="M50 78v12" />
          </svg>
        </div>

        <h1>Welcome Back</h1>
        <p>Login to your AquaMind account</p>
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label>Email</label>

          <div class="input-box">
            <span class="input-icon">✉</span>
            <input
              type="email"
              id="email"
              placeholder="Enter your email"
              required
            />
          </div>
        </div>

        <div class="form-group">
          <label>Password</label>

          <div class="input-box">
            <span class="input-icon">♙</span>
            <input
              type="password"
              id="password"
              placeholder="Enter your password"
              required
              minlength="6"
            />

            <button type="button" class="show-password" id="showPassword">
              👁
            </button>
          </div>
        </div>

        <button type="submit" class="login-btn">Login</button>

        <p id="message"></p>
      </form>

      <div class="divider">OR</div>

      <p class="signup">
        <a href="index.html">Home</a>
        &nbsp;•&nbsp; Don't have an account?
        <a href="signup.html">Sign Up</a>
      </p>
    </div>

    <script>
      const password = document.getElementById("password");
      const showPassword = document.getElementById("showPassword");
      const loginForm = document.getElementById("loginForm");
      const message = document.getElementById("message");

      showPassword.addEventListener("click", function () {
        if (password.type === "password") {
          password.type = "text";
          showPassword.innerHTML = "🙈";
        } else {
          password.type = "password";
          showPassword.innerHTML = "👁";
        }
      });

      loginForm.addEventListener("submit", async (event) => {
        event.preventDefault();

        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;
        const message = document.getElementById("message");

        try {
          const response = await fetch("http://localhost:5000/api/auth/login", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              email,
              password,
            }),
          });

          const data = await response.json();
          message.textContent = data.message;

          if (response.ok) {
            localStorage.setItem("token", data.token);
            localStorage.setItem("user", JSON.stringify(data.user));

            setTimeout(() => {
              window.location.href = "dashboard.html";
            }, 1000);
          }
        } catch (error) {
          message.textContent = "Server is not running.";
        }
      });
    </script>
  </body>
</html>
