<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AquaMind - Smart Irrigation</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main class="hero">
      <div class="logo">
        <span class="logo-icon">♧</span>
        <span>AquaMind</span>
      </div>

      <section class="hero-content">
        <h1>
          AI-Based Smart Irrigation
          <span>Recommendation System</span>
        </h1>

        <p>Smart irrigation prediction using soil, crop, and weather data</p>

        <div class="buttons">
          <button
            class="btn primary"
            id="getStarted"
            onclick="window.location.href = 'signup.html'"
          >
            Get Started
          </button>

          <button
            class="btn secondary"
            id="loginBtn"
            onclick="window.location.href = 'login.html'"
          >
            Login
          </button>
        </div>
      </section>

      <section class="stats">
        <div class="stat">
          <strong>6+</strong>
          <span>CROPS SUPPORTED</span>
        </div>

        <div class="stat">
          <strong>AI</strong>
          <span>SMART PREDICTION</span>
        </div>

        <div class="stat">
          <strong>24/7</strong>
          <span>IRRIGATION INSIGHTS</span>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
