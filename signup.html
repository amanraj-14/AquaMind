<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AquaMind | Sign Up</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        min-height: 100vh;
        margin: 0;
        padding: 24px 16px;
        display: grid;
        place-items: center;
        font-family: Arial, Helvetica, sans-serif;
        color: #f5fffa;
        background: radial-gradient(
          circle at 50% 35%,
          #075240 0%,
          #002c23 42%,
          #001b16 100%
        );
      }
      .card {
        width: min(100%, 560px);
        padding: 35px 44px;
        border: 2px solid rgba(86, 220, 171, 0.35);
        border-radius: 24px;
        background: rgba(0, 37, 30, 0.78);
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
      }
      header {
        text-align: center;
        margin-bottom: 30px;
      }
      .logo {
        width: 92px;
        height: 92px;
        display: grid;
        place-items: center;
        margin: 0 auto 16px;
        color: #82ed99;
        border: 3px solid #86ee9d;
        border-radius: 50%;
      }
      .logo svg {
        width: 62px;
        height: 62px;
      }
      h1 {
        margin: 0;
        font-size: clamp(2rem, 6vw, 2.6rem);
      }
      header p {
        margin: 10px 0 0;
        font-size: 1.1rem;
        color: #b8efc2;
      }
      .field {
        margin-bottom: 18px;
      }
      label {
        display: block;
        margin-bottom: 8px;
        color: #d8ffd1;
        font-size: 1.05rem;
        font-weight: bold;
      }
      .input-wrap {
        position: relative;
      }
      input {
        width: 100%;
        height: 55px;
        padding: 0 50px 0 18px;
        border: 1px solid rgba(76, 224, 169, 0.35);
        border-radius: 12px;
        outline: 0;
        background: rgba(0, 22, 18, 0.5);
        color: white;
        font-size: 1rem;
      }
      input::placeholder {
        color: #748784;
      }
      input:focus {
        border-color: #35e7a8;
        box-shadow: 0 0 0 3px rgba(53, 231, 168, 0.14);
      }
      .toggle {
        position: absolute;
        right: 13px;
        top: 50%;
        transform: translateY(-50%);
        border: 0;
        background: none;
        color: #b9cac7;
        font-size: 19px;
        cursor: pointer;
      }
      .submit {
        width: 100%;
        height: 60px;
        margin-top: 8px;
        border: 0;
        border-radius: 12px;
        cursor: pointer;
        color: white;
        font-size: 1.15rem;
        font-weight: bold;
        background: linear-gradient(135deg, #42e5ac, #1dae78);
      }
      .submit:hover {
        filter: brightness(1.08);
        transform: translateY(-1px);
      }
      #message {
        min-height: 20px;
        margin: 12px 0 0;
        text-align: center;
        font-size: 0.92rem;
        color: #a8ffd2;
      }
      .divider {
        display: flex;
        align-items: center;
        gap: 20px;
        margin: 28px 0;
        color: #84938f;
      }
      .divider::before,
      .divider::after {
        content: "";
        height: 1px;
        flex: 1;
        background: rgba(183, 255, 221, 0.22);
      }
      .login {
        margin: 0;
        text-align: center;
        font-size: 1rem;
      }
      a {
        color: #35e9ad;
        font-weight: bold;
      }
      @media (max-width: 500px) {
        .card {
          padding: 30px 22px;
        }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <header>
        <div class="logo" aria-hidden="true">
          <svg
            viewBox="0 0 100 100"
            fill="none"
            stroke="currentColor"
            stroke-width="4"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              fill="currentColor"
              stroke="none"
              d="M51 11C45 27 30 37 30 55c0 13 9 23 20 23s20-10 20-23c0-18-13-29-19-44Z"
            />
            <path d="M57 58c0 7-4 11-9 13" stroke="#003a2d" />
            <path
              d="M48 78C38 65 24 65 15 64c6 17 19 26 33 25M52 78c10-13 24-13 33-14-6 17-19 26-33 25M50 78v12"
            />
          </svg>
        </div>
        <h1>Create Account</h1>
        <p>Join AquaMind and grow with us</p>
      </header>

      <form id="signupForm" novalidate>
        <div class="field">
          <label for="name">Full Name</label
          ><input
            id="name"
            type="text"
            placeholder="Enter your full name"
            required
          />
        </div>
        <div class="field">
          <label for="email">Email</label
          ><input
            id="email"
            type="email"
            placeholder="Enter your email"
            required
          />
        </div>
        <div class="field">
          <label for="password">Create Password</label>
          <div class="input-wrap">
            <input
              id="password"
              type="password"
              placeholder="Minimum 6 characters"
              minlength="6"
              required
            /><button
              class="toggle"
              type="button"
              data-target="password"
              aria-label="Show password"
            >
              👁
            </button>
          </div>
        </div>
        <div class="field">
          <label for="confirmPassword">Confirm Password</label>
          <div class="input-wrap">
            <input
              id="confirmPassword"
              type="password"
              placeholder="Re-enter your password"
              minlength="6"
              required
            /><button
              class="toggle"
              type="button"
              data-target="confirmPassword"
              aria-label="Show password"
            >
              👁
            </button>
          </div>
        </div>
        <button class="submit" type="submit">Create Account</button>
        <p id="message" role="alert"></p>
      </form>
      <div class="divider">OR</div>

      <p class="login">
        <a href="index.html">Home</a>
        &nbsp;•&nbsp; Already have an account?
        <a href="login.html">Login</a>
      </p>
    </main>
    <script>
      document
        .getElementById("signupForm")
        .addEventListener("submit", async (event) => {
          event.preventDefault();

          const name = document.getElementById("name").value;
          const email = document.getElementById("email").value;
          const password = document.getElementById("password").value;
          const confirmPassword =
            document.getElementById("confirmPassword").value;
          const message = document.getElementById("message");

          if (password !== confirmPassword) {
            message.textContent = "Passwords do not match.";
            return;
          }

          try {
            const response = await fetch(
              "http://localhost:5000/api/auth/signup",
              {
                method: "POST",
                headers: {
                  "Content-Type": "application/json",
                },
                body: JSON.stringify({
                  name,
                  email,
                  password,
                }),
              },
            );

            const data = await response.json();
            message.textContent = data.message;

            if (response.ok) {
              setTimeout(() => {
                window.location.href = "login.html";
              }, 1000);
            }
          } catch (error) {
            message.textContent = "Server is not running. Please try again.";
          }
        });
    </script>
  </body>
</html>
